:root{--site-nav-h:34px}

.site-nav a{color:#e8eef5;text-decoration:none;white-space:nowrap}.site-nav a:hover,.site-nav a:focus-visible{text-decoration:underline}
.site-nav .sn-brand{letter-spacing:.18em;text-transform:uppercase}.site-nav .sn-state{margin-left:auto;font-weight:500;opacity:.8;white-space:nowrap}
@media (max-width:420px){.site-nav .sn-state{display:none}}
.ea-app{min-height:calc(100vh - var(--site-nav-h))!important;min-height:calc(100dvh - var(--site-nav-h))!important}
.boot-note{margin:0;padding:3rem 1.25rem;text-align:center;font:600 17px/1.5 system-ui,-apple-system,sans-serif;color:#e8eef5}
.ea-logo{cursor:pointer}
</style>
